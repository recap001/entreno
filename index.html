<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entreno">
<meta name="theme-color" content="#DADCDC">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Entreno de hoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@900&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-screen gym companion — session switch + progress dial, a dot-grid panel with both loads, bottom bar listing the session */
:root{
  --bg:#DADCDC; --ink:#141414; --muted:#4F5151; --soft:#757777;
  --face:#EDEEEE; --well:#CDCFCF; --panel:#D0D2D2; --grid-dot:#AAACAC; --tick:#B9BBBB; --minor:#A6A8A8;
  --red:#E2372B; --bar:#232321; --bar-ink:#F2F2F0; --bar-muted:#A3A39E; --bar-done:#6E6E69; --bar-line:#45453F;
  --s1:#EE6A3F; --s2:#2F8A4C; --s3:#E9E6DD;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --dots:"Doto","Courier New",monospace;
  --cell:9px;
  color-scheme:light;
}
*{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--red);outline-offset:3px}
button:disabled{opacity:.35;cursor:default}

.app{max-width:420px;margin:0 auto;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* week */
.week{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ring{width:44px;height:44px;border-radius:50%;border:1.5px dashed #9C9E9E;background:transparent;display:grid;place-items:center;flex:none}
.wk{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.wk-label{font-size:15px;font-weight:500;color:#5F6161}
.wk-label b{color:var(--ink);font-weight:600}
.today{border:0;background:none;color:var(--ink);font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:2px 4px}
.status{font-size:11px;line-height:14px;color:var(--muted);display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.status:empty{display:none}
.status button{background:none;border:0;color:var(--ink);font-weight:600;font-size:11px;text-decoration:underline;text-underline-offset:3px;padding:2px}

/* session + dial */
.top{display:flex;gap:12px;align-items:stretch}
.sessions{flex:1;min-width:0;background:var(--well);border-radius:32px;padding:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}
.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.stack{display:flex;flex-direction:column;align-items:center;gap:10px}
.sess{width:48px;height:48px;border-radius:50%;border:0;color:var(--ink);font-size:20px;font-weight:800}
.sess[aria-pressed="true"]{box-shadow:0 0 0 3px var(--well),0 0 0 5px var(--ink)}
.dial{width:172px;height:172px;border-radius:50%;background:var(--face);position:relative;flex:none}
.dial span{position:absolute;left:50%;top:50%}
.trail{position:absolute;left:50%;top:50%;width:154px;height:154px;margin:-77px 0 0 -77px;border-radius:50%;pointer-events:none;
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 18px),#000 calc(100% - 17.5px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 18px),#000 calc(100% - 17.5px))}
.hub{position:absolute;left:50%;top:50%;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px #D6D8D8;
  display:grid;place-items:center;color:var(--face);font-family:var(--dots);font-weight:900;font-size:26px;font-variant-numeric:tabular-nums}

/* dot-grid panel: every block snaps to the 9px grid */
.panel-wrap{flex:1 0 auto;display:flex;justify-content:center}
.panel{box-sizing:border-box;width:100%;border-radius:27px;background-color:var(--panel);
  background-image:radial-gradient(var(--grid-dot) 1.1px,transparent 1.4px);background-size:var(--cell) var(--cell);background-position:0 0;
  padding:calc(var(--cell)*2);display:flex;flex-direction:column;gap:calc(var(--cell)*3)}
.panel h1{margin:0;font-size:40px;font-weight:800;line-height:36px;letter-spacing:-.03em;text-wrap:balance}
.people{display:flex;flex-direction:column;gap:calc(var(--cell)*3)}
.person{display:flex;flex-direction:column}
.divider{height:18px;background:linear-gradient(var(--ink),var(--ink)) 0 0/100% 2px no-repeat}
.pname{font-size:20px;font-weight:700;line-height:27px;color:#3F4141}
.nums{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-top:9px;min-height:63px}
.units{display:flex;justify-content:space-between;margin-top:9px;font-size:17px;font-weight:600;line-height:18px;color:#3F4141}
.matrix{display:grid;grid-auto-rows:var(--cell);flex:none}
.matrix i{display:block;width:var(--cell);height:var(--cell)}
.matrix i.on{background:linear-gradient(currentColor,currentColor) center/7px 7px no-repeat}
.matrix.kg{color:var(--ink)}
.matrix.reps{color:var(--muted)}
.state{height:63px;display:flex;align-items:center;font-size:28px;font-weight:800;color:var(--soft)}

/* done + messages */
.card{background:var(--face);border-radius:28px;padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.025em;text-wrap:balance}
.card h2 span{color:var(--soft)}
.card p{margin:0;color:var(--muted);line-height:1.45}
.summary{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.summary li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #D6D8D8;font-size:14px}
.summary li:last-child{border-bottom:0}
.summary b{font-weight:600}
.summary span{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.pill{align-self:flex-start;border:0;border-radius:999px;background:var(--ink);color:var(--face);padding:14px 22px;font-size:15px;font-weight:600}

/* bottom bar */
.bar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--bar);border-radius:44px;padding:8px;display:flex;align-items:center;gap:12px}
.back{width:56px;height:56px;border-radius:50%;border:1px solid var(--bar-line);background:transparent;color:var(--bar-ink);display:grid;place-items:center;flex:none}
.next{width:64px;height:64px;border-radius:50%;border:0;background:var(--bar-ink);color:var(--ink);display:grid;place-items:center;flex:none}
.steps{flex:1;min-width:0;margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:2px 3px;font-size:12px;line-height:16px}
.steps li{white-space:nowrap;color:var(--bar-muted)}
.steps li.done{color:var(--bar-done);text-decoration:line-through}
.steps li.now{color:var(--bar-ink);font-weight:700}
.steps .dash{display:inline-block;width:4px;height:1px;background:var(--bar-done);vertical-align:middle;margin-right:3px}
</style>
</head>
<body>
<div class="app">
  <header class="week">
    <button class="ring" id="prevWeek" aria-label="Semana anterior" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="wk">
      <div class="wk-label" id="weekLabel">Cargando semana…</div>
      <button class="today" id="goToday" hidden>Volver a esta semana</button>
      <div class="status" id="status"></div>
    </div>
    <button class="ring" id="nextWeek" aria-label="Semana siguiente" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  </header>

  <div class="top" id="top" hidden>
    <section class="sessions" aria-label="Sesión">
      <span class="lbl">Sesión</span>
      <div class="stack" id="sessions"></div>
    </section>
    <div class="dial" id="dial" role="img" aria-label="">
      <div id="ticks"></div>
      <div class="trail" id="trail"></div>
      <div class="hub" id="count"></div>
    </div>
  </div>

  <div class="panel-wrap" id="panelWrap" hidden>
    <section class="panel" id="panel" aria-live="polite">
      <h1 id="exName"></h1>
      <div class="people" id="people"></div>
    </section>
  </div>

  <section class="card" id="msg">
    <h2>Cargando tu entreno…</h2>
    <p>Leyendo la hoja de Google Sheets.</p>
  </section>

  <section class="card" id="done" hidden></section>

  <nav class="bar" id="bar" hidden>
    <button class="back" id="back" aria-label="Anterior"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <ol class="steps" id="steps" aria-label="Ejercicios de la sesión"></ol>
    <button class="next" id="next" aria-label="Siguiente"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </nav>
</div>

<script>
const SHEET_ID = "19gUu7DdJLyB_Mvt89z9Dtkj5yI1heQjECgWnM9rzs1A";
const SHEET_GID = 0; // "Tracker" tab
const RANGE = "Tracker!A1:CY60";
const SERVER = "Google Sheets";
const MONTHS = {ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,sept:8,oct:9,nov:10,dic:11};
const MONTH_SHORT = ["ene","feb","mar","abr","may","jun","jul","ago","sept","oct","nov","dic"];
const SESSION_COLORS = ["var(--s1)","var(--s2)","var(--s3)"];
const CELL = 9;
// 5×7 dot-matrix glyphs; one glyph pixel = one cell of the panel's dot grid
const GLYPHS = {
  "0":["01110","10001","10011","10101","11001","10001","01110"],
  "1":["00100","01100","00100","00100","00100","00100","01110"],
  "2":["01110","10001","00001","00010","00100","01000","11111"],
  "3":["11111","00010","00100","00010","00001","10001","01110"],
  "4":["00010","00110","01010","10010","11111","00010","00010"],
  "5":["11111","10000","11110","00001","00001","10001","01110"],
  "6":["00110","01000","10000","11110","10001","10001","01110"],
  "7":["11111","00001","00010","00100","01000","01000","01000"],
  "8":["01110","10001","10001","01110","10001","10001","01110"],
  "9":["01110","10001","10001","01111","00001","00010","01100"],
  ",":["00","00","00","00","00","01","10"],
  "-":["00000","00000","00000","11111","00000","00000","00000"]
};

const $ = id => document.getElementById(id);
const S = { data:null, week:0, todayWeek:-1, session:0, step:0, finished:false, fetchedAt:null };

/* ---------- storage (per-device convenience only) ---------- */
function load(){ try{ return JSON.parse(localStorage.getItem("entreno-state")||"null"); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem("entreno-state", JSON.stringify({day:todayKey(), week:S.week, session:S.session, step:S.step, finished:S.finished})); }catch(e){} }
function todayKey(){ const t=new Date(); return t.getFullYear()+"-"+(t.getMonth()+1)+"-"+t.getDate(); }

/* ---------- parsing ---------- */
function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){
      if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; }
      else f+=c;
    }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
    else if(c!=='\r') f+=c;
  }
  if(f || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function parseDM(s){
  const m = String(s||"").trim().toLowerCase().match(/^(\d{1,2})\s+([a-zñ]+)/);
  if(!m || !(m[2] in MONTHS)) return null;
  return {d:+m[1], m:MONTHS[m[2]]};
}
function buildWeeks(datesRow, labelsRow){
  const raw=[];
  for(let c=3;c<datesRow.length;c+=2){
    const a=parseDM(datesRow[c]);
    if(!a) break;
    raw.push({col:c, a, label:String((labelsRow||[])[c]||"").trim()});
  }
  const today=new Date(); today.setHours(12,0,0,0);
  function withYear(y0){
    let y=y0, last=-1;
    return raw.map(w=>{
      if(w.a.m<last) y++;
      last=w.a.m;
      const start=new Date(y,w.a.m,w.a.d,0,0,0);
      const end=new Date(start); end.setDate(start.getDate()+6); end.setHours(23,59,59);
      return {col:w.col, label:w.label, start, end};
    });
  }
  for(const y of [today.getFullYear(), today.getFullYear()-1]){
    const ws=withYear(y);
    if(ws.length && ws[0].start<=today && ws[ws.length-1].end>=today) return ws;
  }
  return withYear(today.getFullYear());
}
function parseSheet(values){
  const rows=(values||[]).map(r=>r||[]);
  const people=[];
  for(let i=0;i<rows.length;i++){
    if(String(rows[i][3]||"").trim().toLowerCase()!=="weight") continue;
    const nameRow=rows[i-2]||[];
    const nameRaw=String(nameRow[0]||"").replace(/^[^\p{L}]+/u,"").trim();
    const exercises=[]; let group="";
    for(let j=i+1;j<rows.length;j++){
      const r=rows[j]; const name=String(r[2]||"").trim();
      if(!name) break;
      if(String(r[0]||"").trim()) group=String(r[0]).trim();
      exercises.push({group, name, cells:r});
    }
    people.push({name:nameRaw||("Persona "+(people.length+1)), dates:rows[i-1]||[], labels:nameRow, exercises});
  }
  if(!people.length) return null;
  const weeks=buildWeeks(people[0].dates, people[0].labels);
  const groups=[...new Set(people[0].exercises.map(e=>e.group))];
  const base=groups.filter(g=>/base/i.test(g));
  const days=groups.filter(g=>!/base/i.test(g));
  const sessions=(days.length?days:groups).map(d=>({label:d, groups:[...base,d]}));
  return {people, weeks, sessions};
}

/* ---------- helpers ---------- */
const fmtDay = d => d.getDate()+" "+MONTH_SHORT[d.getMonth()];
function weekText(w){
  return w.start.getMonth()===w.end.getMonth()
    ? w.start.getDate()+"–"+fmtDay(w.end)
    : fmtDay(w.start)+" – "+fmtDay(w.end);
}
function cell(p, ex, week){
  const e=p.exercises.find(x=>x.name===ex.name && x.group===ex.group) || p.exercises.find(x=>x.name===ex.name);
  if(!e || !week) return {w:"",r:""};
  return {w:String(e.cells[week.col]??"").trim(), r:String(e.cells[week.col+1]??"").trim()};
}
const isOff = v => v.w==="--" && v.r==="--";
const isEmpty = v => !v.w && !v.r;
function sessionExercises(){
  const s=S.data.sessions[S.session]; if(!s) return [];
  return S.data.people[0].exercises.filter(e=>s.groups.includes(e.group));
}
function el(tag, attrs, ...kids){
  const n=document.createElement(tag);
  for(const k in (attrs||{})){ if(k==="class") n.className=attrs[k]; else n.setAttribute(k,attrs[k]); }
  for(const k of kids){ if(k==null) continue; n.append(k.nodeType?k:document.createTextNode(k)); }
  return n;
}
function shortVal(v){
  if(isEmpty(v)) return "sin datos";
  if(isOff(v)) return "no toca";
  return (v.w==="--"?"sin carga":v.w+" kg")+(v.r&&v.r!=="--"?" × "+v.r:"");
}
function matrix(text, cls){
  const rows=["","","","","","",""];
  String(text).replace(/\./g,",").split("").forEach((ch,n)=>{
    const g=GLYPHS[ch]||GLYPHS["-"];
    for(let r=0;r<7;r++) rows[r]+=(n?"0":"")+g[r];
  });
  const m=el("div",{class:"matrix "+cls,"aria-hidden":"true"});
  m.style.gridTemplateColumns="repeat("+rows[0].length+", var(--cell))";
  rows.forEach(row=>row.split("").forEach(b=>m.append(el("i",b==="1"?{class:"on"}:null))));
  return m;
}
function tick(deg, w, h, r, color){
  const t=el("span");
  t.style.cssText="width:"+w+"px;height:"+h+"px;margin:"+(-h/2)+"px 0 0 "+(-w/2)+"px;border-radius:"+(w/2)+"px;background:"+color+";transform:rotate("+deg+"deg) translateY(-"+r+"px)";
  return t;
}

/* ---------- render ---------- */
function show(view){
  const ex=view==="exercise";
  $("top").hidden=!ex; $("panelWrap").hidden=!ex; $("bar").hidden=!ex;
  $("done").hidden=view!=="done"; $("msg").hidden=view!=="msg";
}
function renderHeader(){
  const ws=S.data.weeks, w=ws[S.week];
  const lab=$("weekLabel"); lab.replaceChildren();
  if(w){ if(w.label) lab.append(el("b",null,w.label)," · "); lab.append(weekText(w)); }
  else lab.append("Sin semanas");
  $("prevWeek").disabled = S.week<=0;
  $("nextWeek").disabled = S.week>=ws.length-1;
  $("goToday").hidden = S.todayWeek<0 || S.todayWeek===S.week;
}
function renderSessions(){
  const box=$("sessions"); box.replaceChildren();
  S.data.sessions.forEach((s,i)=>{
    const b=el("button",{class:"sess","aria-pressed":String(i===S.session),"aria-label":"Sesión "+(i+1)+" ("+s.label+")"},String(i+1));
    b.style.background=SESSION_COLORS[i%SESSION_COLORS.length];
    b.onclick=()=>{ if(S.session!==i){ S.session=i; S.step=0; S.finished=false; save(); render(); } };
    box.append(b);
  });
}
function renderDial(exs){
  const n=exs.length, step=360/n, ticks=$("ticks"); ticks.replaceChildren();
  for(let k=0;k<48;k++) ticks.append(tick(k*7.5,2,2,79,"var(--minor)"));
  exs.forEach((x,i)=>ticks.append(i===S.step ? tick(i*step,2.5,18,68,"var(--red)") : tick(i*step,1.5,18,68,i<S.step?"var(--red)":"var(--tick)")));
  const end=S.step*step;
  $("trail").style.background="conic-gradient(var(--red) 0deg "+end+"deg, transparent "+end+"deg 360deg)";
  $("count").textContent=(S.step+1)+"/"+n;
  $("dial").setAttribute("aria-label",exs[S.step].name+", ejercicio "+(S.step+1)+" de "+n);
}
function renderPanel(ex){
  const w=S.data.weeks[S.week];
  $("exName").textContent=ex.name;
  const box=$("people"); box.replaceChildren();
  S.data.people.forEach((p,i)=>{
    const v=cell(p,ex,w), off=isOff(v), empty=isEmpty(v);
    const row=el("div",{class:"person"});
    if(i>0) row.append(el("div",{class:"divider","aria-hidden":"true"}));
    row.append(el("span",{class:"pname"},p.name));
    const nums=el("div",{class:"nums"}), units=el("div",{class:"units"});
    if(off||empty){
      nums.append(el("span",{class:"state"},off?"No toca":"Sin datos"));
      units.append(el("span",null,""));
    }else{
      const noLoad=v.w==="--"||!v.w, reps=v.r&&v.r!=="--"?v.r:"";
      nums.append(matrix(noLoad?"-":v.w,"kg"), matrix(reps||"-","reps"));
      nums.setAttribute("role","img");
      nums.setAttribute("aria-label",(noLoad?"sin carga":v.w+" kg")+(reps?", "+reps+" reps":""));
      units.append(el("span",null,noLoad?"sin carga":"kg"), el("span",null,"reps"));
    }
    row.append(nums, units);
    box.append(row);
  });
  snapPanel();
}
function renderSteps(exs){
  const ol=$("steps"); ol.replaceChildren();
  exs.forEach((x,i)=>{
    const li=el("li",{class:i<S.step?"done":i===S.step?"now":""});
    if(i===S.step) li.setAttribute("aria-current","step");
    if(i>0) li.append(el("span",{class:"dash","aria-hidden":"true"}));
    li.append(x.name);
    ol.append(li);
  });
  $("back").disabled = S.step===0;
  $("next").setAttribute("aria-label", S.step===exs.length-1?"Terminar":"Siguiente");
}
function renderDone(exs){
  const w=S.data.weeks[S.week];
  const list=el("ul",{class:"summary"});
  exs.forEach(ex=>{
    const vals=S.data.people.map(p=>p.name+": "+shortVal(cell(p,ex,w))).join(" · ");
    list.append(el("li",null, el("b",null,ex.name), el("span",null,vals)));
  });
  const again=el("button",{class:"pill",id:"restart"},"Volver al primer ejercicio");
  again.onclick=()=>{ S.step=0; S.finished=false; save(); render(); };
  $("done").replaceChildren(el("h2",null,"Buen trabajo",el("br"),el("span",null,"Sesión "+(S.session+1)+" completada")), list, again);
  show("done");
}
function render(){
  if(!S.data) return;
  renderHeader();
  renderSessions();
  const exs=sessionExercises();
  if(!exs.length){ showMessage("Sin ejercicios","No he encontrado ejercicios para esta sesión en la hoja."); return; }
  if(S.step>=exs.length) S.step=exs.length-1;
  if(S.finished){ renderDone(exs); return; }
  show("exercise");
  renderDial(exs);
  renderPanel(exs[S.step]);
  renderSteps(exs);
}
function showMessage(title, text, action){
  const kids=[el("h2",null,title), el("p",null,text)];
  if(action){ const b=el("button",{class:"pill",id:"msg-action"},action.label); b.onclick=action.run; kids.push(b); }
  $("msg").replaceChildren(...kids);
  show("msg");
}
function renderStatus(){
  const s=$("status"); s.replaceChildren();
  if(!S.fetchedAt) return;
  const d=new Date(S.fetchedAt);
  s.append(el("span",null,"Actualizado "+d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")));
  const b=el("button",{id:"refresh"},"Actualizar"); b.onclick=()=>fetchData(true); s.append(b);
}
// keep the panel a whole number of grid cells wide so its right edge sits on the dots too
function snapPanel(){
  const wrap=$("panelWrap"); if(wrap.hidden) return;
  const avail=wrap.clientWidth;
  if(avail) $("panel").style.width=Math.floor(avail/CELL)*CELL+"px";
}
window.addEventListener("resize", snapPanel);

/* ---------- navigation ---------- */
$("next").onclick=()=>{ const n=sessionExercises().length; if(S.step<n-1){S.step++;} else {S.finished=true;} save(); render(); window.scrollTo({top:0}); };
$("back").onclick=()=>{ if(S.step>0){S.step--; save(); render(); window.scrollTo({top:0});} };
$("prevWeek").onclick=()=>{ if(S.week>0){S.week--; save(); render();} };
$("nextWeek").onclick=()=>{ if(S.week<S.data.weeks.length-1){S.week++; save(); render();} };
$("goToday").onclick=()=>{ S.week=S.todayWeek; save(); render(); };
document.addEventListener("keydown",e=>{
  if(!S.data || S.finished || $("bar").hidden) return;
  if(e.key==="ArrowRight"){ $("next").click(); }
  if(e.key==="ArrowLeft"){ $("back").click(); }
});

/* ---------- keep screen on during the workout ---------- */
let lock=null;
async function wake(){ try{ if("wakeLock" in navigator && document.visibilityState==="visible") lock=await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ wake(); if(S.data) fetchData(false); } });

/* ---------- data ---------- */
// Inside claude.ai the page reads the sheet through the Google Sheets connector.
// Anywhere else (GitHub Pages, home-screen app) it reads the sheet's CSV export,
// which works only while the sheet is shared as "Anyone with the link: Viewer".
let mcp=null;
async function getValues(refresh){
  if(mcp){
    const res=await mcp.callTool(SERVER,"get_values",{spreadsheetId:SHEET_ID,range:RANGE},{cache: refresh?{refresh:true,staleTime:60000}:{staleTime:60000}});
    return { values:(res.payload||{}).values, at:(res.cache&&res.cache.storedAt)||Date.now() };
  }
  const url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/export?format=csv&gid="+SHEET_GID+"&range=A1:CY60&t="+Date.now();
  let r;
  try{ r=await fetch(url,{cache:"no-store"}); }
  catch(e){ throw {code: navigator.onLine===false ? "offline" : "not_shared"}; }
  if(!r.ok) throw {code: r.status===404 ? "not_found" : "not_shared"};
  const text=await r.text();
  if(/^\s*</.test(text)) throw {code:"not_shared"};
  return { values:parseCSV(text), at:Date.now() };
}
function errorCopy(err){
  const code=err&&err.code;
  switch(code){
    case "not_shared": return ["No puedo leer la hoja","Abre la hoja en Google Sheets, pulsa Compartir y en «Acceso general» elige «Cualquier persona con el enlace» como Lector. Después pulsa Reintentar."];
    case "not_found": return ["No encuentro la hoja","Comprueba que la hoja Workout tracker sigue existiendo y pulsa Reintentar."];
    case "offline": return ["Sin conexión","Conéctate a internet y pulsa Reintentar."];
    case "needs_reauth": return ["Reconecta Google Sheets","La conexión con Google ha caducado. Vuelve a conectarla en claude.ai → Ajustes → Conectores y pulsa Reintentar."];
    case "server_not_connected": return ["Falta Google Sheets","Añade el conector de Google Sheets en claude.ai → Ajustes → Conectores para ver el entreno."];
    case "selection_required": return ["Elige la cuenta de Google","Tienes más de un conector de Google Sheets. Elige cuál usar en el aviso de claude.ai y pulsa Reintentar."];
    case "not_in_manifest": case "consent_required": return ["Sin permiso para leer la hoja","Esta página necesita tu permiso para leer Google Sheets. Actívalo en el menú de permisos del artefacto y pulsa Reintentar."];
    case "blocked_by_policy": return ["Bloqueado por tu organización","Tu organización no permite que esta página use Google Sheets."];
    case "tool_error": return ["Google Sheets no ha devuelto la hoja",(err.message||"Comprueba que la hoja sigue existiendo y que tienes acceso.")];
    case "server_unavailable": return ["Google Sheets no responde","Puede ser algo momentáneo. Prueba otra vez en unos segundos."];
    default: return ["No se ha podido cargar la hoja",(err&&err.message)||"Prueba otra vez."];
  }
}
async function fetchData(refresh, retried){
  try{
    const {values, at}=await getValues(refresh);
    const data=parseSheet(values);
    if(!data){ showMessage("Hoja sin el formato esperado","No encuentro las filas «Weight / Reps» en la pestaña Tracker."); return; }
    const first=!S.data;
    S.data=data;
    S.fetchedAt=at;
    const today=new Date();
    S.todayWeek=data.weeks.findIndex(w=>w.start<=today && w.end>=today);
    if(first){
      const st=load();
      if(st && st.day===todayKey() && st.week<data.weeks.length){ Object.assign(S,{week:st.week,session:Math.min(st.session,data.sessions.length-1),step:st.step,finished:!!st.finished}); }
      else{
        S.week = S.todayWeek>=0 ? S.todayWeek : Math.max(0,data.weeks.findIndex(w=>w.start>today));
        S.session = st && st.session<data.sessions.length ? st.session : 0;
        S.step=0; S.finished=false;
      }
    }
    render(); renderStatus(); wake();
  }catch(err){
    if(err && err.retryable && !retried){ setTimeout(()=>fetchData(refresh,true), Math.min(err.retryAfterMs||1500+Math.random()*1500, 10000)); return; }
    if(S.data){ $("status").replaceChildren(el("span",null,"No se ha podido actualizar; mostrando los últimos datos.")); return; }
    const [t,m]=errorCopy(err);
    $("weekLabel").textContent="Entreno";
    showMessage(t,m,{label:"Reintentar",run:()=>{ showMessage("Cargando tu entreno…","Leyendo la hoja de Google Sheets."); fetchData(true); }});
  }
}
(async()=>{
  try{ mcp = window.claude && window.claude.use ? await window.claude.use("mcp") : null; }catch(e){ mcp=null; }
  fetchData(false);
})();
</script>
